<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construct 3 RAG Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#3c3f3b99;border-radius:var(--border-radius-sm)}
::-webkit-scrollbar-thumb:hover{background:#55554f}
*{scrollbar-width:thin;scrollbar-color:#3c3f3b99 transparent}

/* Design tokens in the manner of the host UI kits, the dark side of the same
   scale the recording review uses: one warm neutral scale for structure, one
   accent for what is chosen, one info color for data, one for what failed,
   and the syntax palette the JSON views read by. */
:root{
  --color-background-primary:#171716;--color-background-secondary:#201f1e;--color-background-tertiary:#282826;
  --color-text-primary:#f2f0e9;--color-text-secondary:#a6a39a;--color-text-tertiary:#94928a;
  --color-border-primary:#3c3c39;--color-border-secondary:#4c4c47;
  --color-accent:#d97757;--color-accent-hover:#e08a6c;--color-accent-wash:#2c221b;
  --color-grid-dot:#262623;
  --color-info:#8fb3d9;--color-info-tint:#1d2937;
  --color-success:#7fc8a0;--color-success-tint:#1e2f24;--color-success-strong:#2f6a44;
  --color-warning:#e8c85a;--color-warning-tint:#35241c;
  --color-danger:#e06a5c;--color-danger-tint:#38201b;--color-danger-strong:#7c332a;
  --color-syntax-string:#8fce9a;--color-syntax-number:#c3aae8;--color-syntax-bool:#e8b48a;
  --shadow-card:0 2px 12px rgba(0,0,0,.45);--shadow-menu:0 6px 24px rgba(0,0,0,.6);
  --font-sans:system-ui,-apple-system,sans-serif;--font-mono:'Consolas','Menlo',monospace;
  --font-weight-medium:500;--font-weight-semibold:600;
  --font-text-xs-size:10px;--font-text-sm-size:11px;--font-text-md-size:12px;--font-text-lg-size:13px;
  --border-radius-sm:4px;--border-radius-md:6px;--border-radius-lg:8px;
  --dur-1:120ms;--dur-2:180ms;--ease:cubic-bezier(.4,0,.2,1);
}
body{font-family:var(--font-sans);background:var(--color-background-primary);color:var(--color-text-primary);overflow:hidden;height:100vh}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

/* Toolbar */
#toolbar{position:fixed;top:0;left:0;right:0;z-index:200;height:44px;background:var(--color-background-secondary);border-bottom:1px solid var(--color-border-primary);display:flex;align-items:center;padding:0 16px;gap:10px}
.logo{color:var(--color-accent);font-weight:var(--font-weight-semibold);font-size:var(--font-text-lg-size);white-space:nowrap;letter-spacing:.3px}
.logo span{color:var(--color-syntax-string)}
.sep{width:1px;height:22px;background:var(--color-border-primary)}
.tb-input{padding:5px 10px;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);color:var(--color-text-primary);font-size:var(--font-text-md-size);outline:none;width:240px;transition:border-color var(--dur-1) var(--ease)}
.tb-input:focus{border-color:var(--color-accent)}
.tb-select{padding:5px 10px;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);color:var(--color-text-primary);font-size:var(--font-text-md-size);outline:none;cursor:pointer;transition:border-color var(--dur-1) var(--ease)}
.tb-select:focus{border-color:var(--color-accent)}
.tb-btn{padding:5px 12px;background:transparent;color:var(--color-text-secondary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);cursor:pointer;font-size:var(--font-text-md-size);white-space:nowrap;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.tb-btn:hover{background:var(--color-accent-wash);color:var(--color-text-primary)}
.tb-btn.primary{background:var(--color-accent);color:var(--color-background-primary);border-color:var(--color-accent);font-weight:var(--font-weight-medium)}
.tb-btn.primary:hover{background:var(--color-accent-hover)}

/* Canvas */
#canvas{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;background-image:radial-gradient(circle,var(--color-grid-dot) 1px,transparent 1px);background-size:24px 24px}
#canvas.grabbing{cursor:grabbing}
#world{position:absolute;transform-origin:0 0}
#zoom-info{position:fixed;bottom:8px;right:12px;color:var(--color-text-tertiary);font-size:var(--font-text-xs-size);z-index:100;user-select:none}

/* Card */
.card{position:absolute;width:540px;height:800px;min-width:320px;min-height:160px;background:var(--color-background-secondary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-lg);box-shadow:var(--shadow-card);display:flex;flex-direction:column;resize:both;overflow:hidden;contain:layout;transition:border-color var(--dur-1) var(--ease)}
.card:hover{border-color:var(--color-border-secondary)}
.card-header{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--color-border-primary);cursor:move;gap:6px;background:var(--color-background-tertiary);border-radius:var(--border-radius-lg) var(--border-radius-lg) 0 0;min-height:36px;user-select:none}
.card-title{flex:1;font-size:var(--font-text-md-size);font-weight:var(--font-weight-semibold);color:var(--color-text-primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.method-badge{font-size:var(--font-text-xs-size);font-weight:var(--font-weight-semibold);padding:2px 8px;border-radius:var(--border-radius-sm);letter-spacing:.5px}
.method-badge.get{background:var(--color-success-tint);color:var(--color-success)}
.method-badge.post{background:var(--color-info-tint);color:var(--color-info)}
.hdr-btn{background:none;border:none;color:var(--color-text-tertiary);cursor:pointer;font-size:var(--font-text-md-size);padding:2px 4px;line-height:1;transition:color var(--dur-1) var(--ease)}
.hdr-btn:hover{color:var(--color-text-primary)}
.card-body{padding:10px 12px;flex:1;overflow-y:auto;display:flex;flex-direction:column;min-height:0;gap:8px;overscroll-behavior:contain}

/* Sections */
.section-label{font-size:var(--font-text-xs-size);color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;flex-shrink:0}
.no-body{font-size:var(--font-text-sm-size);color:var(--color-text-tertiary);font-style:italic;padding:8px 0;flex-shrink:0}

/* Context menu */
#ctx-menu{display:none;position:fixed;z-index:500;background:var(--color-background-secondary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-md);box-shadow:var(--shadow-menu);padding:4px 0;min-width:160px;font-size:var(--font-text-sm-size)}
#ctx-menu.open{display:block}
.ctx-item{padding:6px 14px;cursor:pointer;color:var(--color-text-primary);transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease)}
.ctx-item:hover{background:var(--color-accent-wash)}
.ctx-item.danger{color:var(--color-danger)}
.ctx-item.danger:hover{background:var(--color-danger-tint)}
.ctx-sep{height:1px;background:var(--color-border-primary);margin:4px 0}

/* Card sections — no border, just structural containers */
.card-section{flex-shrink:0;overflow:hidden}
.card-section:last-child{flex:1;min-height:0;display:flex;flex-direction:column}

/* Request section */
.request-section{flex-shrink:0;display:flex;flex-direction:column}
.json-editor{width:100%;padding:8px;background:var(--color-background-tertiary);color:var(--color-syntax-string);border:none;border-left:2px solid transparent;border-radius:var(--border-radius-sm);font:var(--font-text-sm-size)/1.5 var(--font-mono);resize:none;outline:none;tab-size:2;min-height:80px;max-height:250px;overflow-y:auto;field-sizing:content}
.json-editor.valid{border-left-color:var(--color-success)}
.json-editor.invalid{border-left-color:var(--color-danger);color:var(--color-danger)}
.json-editor::selection{background:rgba(217,119,87,.3)}

/* Presets */
.preset-btn{padding:2px 6px;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);color:var(--color-text-secondary);font-size:var(--font-text-xs-size);cursor:pointer;white-space:nowrap;transition:background-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.preset-btn:hover{background:var(--color-accent-wash);color:var(--color-text-primary);border-color:var(--color-accent)}

/* Splitter between request and response */
.panel-splitter{height:6px;cursor:row-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
.panel-splitter::after{content:'';width:32px;height:2px;background:var(--color-border-secondary);border-radius:1px;transition:background-color var(--dur-1) var(--ease)}
.panel-splitter:hover::after{background:var(--color-accent)}

/* Search bar */
.search-bar{flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--color-border-primary);margin-bottom:6px}
.search-row{display:flex;align-items:center;gap:6px}
.query-input{flex:1;padding:5px 8px;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);color:var(--color-text-primary);font-size:var(--font-text-md-size);outline:none;transition:border-color var(--dur-1) var(--ease)}
.query-input:focus{border-color:var(--color-accent)}
.query-input::placeholder{color:var(--color-text-tertiary)}
.send-btn{padding:5px 14px;border:none;border-radius:var(--border-radius-sm);cursor:pointer;font-size:var(--font-text-sm-size);font-weight:var(--font-weight-semibold);color:var(--color-background-primary);background:var(--color-accent);transition:background-color var(--dur-1) var(--ease)}
.send-btn:hover{background:var(--color-accent-hover)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.send-btn.ok{background:var(--color-success-strong);color:#fff}
.send-btn.err{background:var(--color-danger-strong);color:#fff}
.latency{font-size:var(--font-text-xs-size);color:var(--color-text-tertiary);font-variant-numeric:tabular-nums}
.search-options{display:flex;align-items:center;gap:6px}
.opt-label{font-size:var(--font-text-xs-size);color:var(--color-text-tertiary)}
.mode-btn{padding:1px 6px;background:none;border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);color:var(--color-text-secondary);font-size:var(--font-text-xs-size);cursor:pointer;transition:border-color var(--dur-1) var(--ease),color var(--dur-1) var(--ease),background-color var(--dur-1) var(--ease)}
.mode-btn:hover{border-color:var(--color-accent);color:var(--color-text-primary)}
.mode-btn.active{background:var(--color-accent);color:var(--color-background-primary);border-color:var(--color-accent)}

/* Request body: collapsible */
.request-section.collapsed .json-editor{display:none}
.req-toggle{font-size:var(--font-text-xs-size);color:var(--color-text-secondary);cursor:pointer;user-select:none;padding:2px 0;transition:color var(--dur-1) var(--ease)}
.req-toggle:hover{color:var(--color-accent)}
.request-section.collapsed .req-toggle::before{content:'▶ '}
.request-section:not(.collapsed) .req-toggle::before{content:'▼ '}

/* Response: takes ALL remaining space */
.response-section{flex:1;min-height:30px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.response-section.collapsed .response-wrap{display:none}
.response-section.collapsed .section-label::before{content:'▶ '}
.response-section:not(.collapsed) .section-label::before{content:'▼ '}
.resp-header{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.response-wrap{flex:1;min-height:0;overflow-y:auto;background:var(--color-background-tertiary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-md);position:relative}
.response-json{padding:8px;font:var(--font-text-sm-size)/1.5 var(--font-mono);color:var(--color-text-primary)}

/* JSON tree viewer */
.jt{font:var(--font-text-sm-size)/1.6 var(--font-mono);color:var(--color-text-primary)}
.jt details{margin-left:16px}
.jt summary{cursor:default;list-style:none;user-select:text}
.jt summary::-webkit-details-marker{display:none}
.jt summary::before{content:'▶ ';color:var(--color-text-tertiary);font-size:var(--font-text-xs-size);cursor:pointer;user-select:none}
.jt details[open]>summary::before{content:'▼ '}
.jt .jk{color:var(--color-info)}
.jt .js{color:var(--color-syntax-string)}
.jt .jn{color:var(--color-syntax-number)}
.jt .jb{color:var(--color-syntax-bool)}
.jt .jnull{color:var(--color-text-tertiary)}
.jt .jbrace{color:var(--color-text-secondary)}
.jt .jcount{color:var(--color-text-tertiary);font-size:var(--font-text-xs-size);margin-left:4px}
.jt .jleaf{margin-left:16px}
.response-placeholder{padding:8px;color:var(--color-text-tertiary);font-size:var(--font-text-sm-size);font-style:italic}
.copy-btn{position:absolute;top:4px;right:4px;padding:2px 8px;background:var(--color-background-secondary);border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);color:var(--color-text-tertiary);font-size:var(--font-text-xs-size);cursor:pointer;opacity:0;transition:opacity var(--dur-2) var(--ease),color var(--dur-1) var(--ease),border-color var(--dur-1) var(--ease)}
.response-wrap:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--color-text-primary);border-color:var(--color-accent)}

/* Syntax highlighting */
.json-key{color:var(--color-info)}
.json-str{color:var(--color-syntax-string)}
.json-num{color:var(--color-syntax-number)}
.json-bool{color:var(--color-syntax-bool)}
.json-null{color:var(--color-text-tertiary)}
.json-brace{color:var(--color-text-secondary)}

/* Result cards */
.result-list{display:flex;flex-direction:column;gap:6px;padding:8px}
.result-card{border:1px solid var(--color-border-primary);border-radius:var(--border-radius-sm);overflow:hidden;font-size:var(--font-text-sm-size)}
.result-header{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--color-background-tertiary)}
.result-type{font-size:var(--font-text-xs-size);font-weight:var(--font-weight-semibold);padding:1px 6px;border-radius:var(--border-radius-sm);text-transform:uppercase;letter-spacing:.3px}
.result-type.ace{background:var(--color-info-tint);color:var(--color-info)}
.result-type.lookup{background:var(--color-warning-tint);color:var(--color-syntax-bool)}
.result-title{font-size:var(--font-text-sm-size);font-weight:var(--font-weight-semibold);color:var(--color-text-primary)}
.result-subtitle{font-size:var(--font-text-xs-size);color:var(--color-text-secondary)}
.result-body{padding:6px 8px;font-size:var(--font-text-xs-size);line-height:1.5;color:var(--color-text-primary)}
.result-body .label{color:var(--color-text-secondary)}
.result-body .val{color:var(--color-syntax-string)}
.result-body .val-zh{color:var(--color-warning)}
.result-content{max-height:80px;overflow-y:auto;padding:4px 8px;font-size:var(--font-text-xs-size);line-height:1.4;color:var(--color-text-secondary);white-space:pre-wrap;word-break:break-all;border-top:1px dashed var(--color-border-primary);cursor:pointer}
.result-content.expanded{max-height:none}
.result-meta{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px}
.result-tag{font-size:var(--font-text-xs-size);padding:1px 5px;background:var(--color-accent-wash);border-radius:var(--border-radius-sm);color:var(--color-text-secondary)}
.search-meta{display:flex;gap:12px;padding:4px 8px;font-size:var(--font-text-xs-size);color:var(--color-text-secondary);border-bottom:1px solid var(--color-border-primary)}

/* Trace log */
.trace-conf{display:inline-block;padding:0 4px;border-radius:var(--border-radius-sm);font-weight:var(--font-weight-semibold)}
.trace-conf.high{color:var(--color-success)}
.trace-conf.mid{color:var(--color-warning)}
.trace-conf.low{color:var(--color-danger)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="toolbar">
  <div class="logo">Construct 3 <span>RAG</span> Playground</div>
  <input id="baseUrl" type="hidden" value="" />
  <div class="sep"></div>
  <select id="apiSelect" class="tb-select">
    <option value="health">GET /health</option>
    <option value="search">POST /search</option>
  </select>
  <button class="tb-btn primary" onclick="addCardFromSelect()">+ Add Card</button>
  <div style="flex:1"></div>
  <span id="env-status" style="font-size:var(--font-text-xs-size);color:var(--color-text-tertiary)">checking...</span>
  <button class="tb-btn" onclick="resetView()">Reset View</button>
</div>
<div id="ctx-menu"></div>

<div id="canvas" onmousedown="canvasDown(event)" onmousemove="canvasMove(event)" onmouseup="canvasUp(event)" onwheel="canvasWheel(event)">
  <div id="world"></div>
</div>
<div id="zoom-info">100%</div>

<script>
// ─── Canvas pan/zoom ───
const canvas = document.getElementById('canvas');
const world = document.getElementById('world');
const zoomInfo = document.getElementById('zoom-info');
let pan = { x: 40, y: 40 }, zoom = 1, panning = false, panStart = {};

function applyTransform() {
  world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
  canvas.style.backgroundPosition = `${pan.x}px ${pan.y}px`;
  canvas.style.backgroundSize = `${24 * zoom}px ${24 * zoom}px`;
  zoomInfo.textContent = Math.round(zoom * 100) + '%';
}

function canvasDown(e) {
  if (e.target !== canvas && e.target !== world) return;
  panning = true; panStart = { x: e.clientX - pan.x, y: e.clientY - pan.y };
  canvas.classList.add('grabbing');
}
function canvasMove(e) {
  if (!panning) return;
  pan.x = e.clientX - panStart.x; pan.y = e.clientY - panStart.y;
  applyTransform();
}
function canvasUp() { panning = false; canvas.classList.remove('grabbing'); }
function canvasWheel(e) {
  // Only zoom when scrolling on canvas background, not inside cards
  if (e.target !== canvas) return;
  e.preventDefault();
  // Zoom from canvas center for consistent feel
  const rect = canvas.getBoundingClientRect();
  const cx = rect.width / 2, cy = rect.height / 2;
  const wx = (cx - pan.x) / zoom, wy = (cy - pan.y) / zoom;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.min(3, Math.max(0.2, zoom * delta));
  pan.x = cx - wx * zoom; pan.y = cy - wy * zoom;
  applyTransform();
}
function resetView() { pan = { x: 40, y: 40 }; zoom = 1; applyTransform(); }

// ─── Panel splitter drag ───
let splitState = null;
function startSplit(e, splitter) {
  e.preventDefault(); e.stopPropagation();
  const reqSection = splitter.previousElementSibling;
  const editor = reqSection?.querySelector('.json-editor');
  if (!editor) return;
  splitState = { editor, startY: e.clientY, startH: editor.offsetHeight };
  document.addEventListener('mousemove', onSplitMove);
  document.addEventListener('mouseup', onSplitUp);
}
function onSplitMove(e) {
  if (!splitState) return;
  const dy = (e.clientY - splitState.startY) / zoom;
  const h = Math.max(40, splitState.startH + dy);
  splitState.editor.style.maxHeight = h + 'px';
  splitState.editor.style.minHeight = h + 'px';
}
function onSplitUp() {
  splitState = null;
  document.removeEventListener('mousemove', onSplitMove);
  document.removeEventListener('mouseup', onSplitUp);
}
applyTransform();

// ─── Card dragging with snap ───
const SNAP_DIST = 8;
const CARD_GAP = 12;
let dragCard = null, dragOff = {}, snapGuideEl = null;

function startDrag(e, card) {
  if (e.button !== 0) return;
  dragCard = card;
  const x = parseFloat(card.style.left) || 0, y = parseFloat(card.style.top) || 0;
  dragOff = { x: e.clientX / zoom - x, y: e.clientY / zoom - y };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  e.preventDefault();
}
function onDrag(e) {
  if (!dragCard) return;
  let nx = e.clientX / zoom - dragOff.x;
  let ny = e.clientY / zoom - dragOff.y;
  // Snap to other cards
  const snap = findSnap(dragCard, nx, ny);
  if (snap.x !== null) nx = snap.x;
  if (snap.y !== null) ny = snap.y;
  dragCard.style.left = nx + 'px';
  dragCard.style.top = ny + 'px';
  drawSnapGuides(snap.guides);
}
function endDrag() {
  dragCard = null;
  drawSnapGuides([]);
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

function findSnap(card, dx, dy) {
  const cards = document.querySelectorAll('.card');
  const dw = card.offsetWidth, dh = card.offsetHeight;
  const edges_x = [dx, dx + dw / 2, dx + dw];
  const edges_y = [dy, dy + dh / 2, dy + dh];
  let sx = null, sy = null;
  const guides = [];

  cards.forEach(c => {
    if (c === card) return;
    const cx = parseFloat(c.style.left) || 0, cy = parseFloat(c.style.top) || 0;
    const cw = c.offsetWidth, ch = c.offsetHeight;
    const tx = [cx, cx + cw / 2, cx + cw];
    const ty = [cy, cy + ch / 2, cy + ch];

    for (const ex of edges_x) {
      for (const t of tx) {
        if (Math.abs(ex - t) < SNAP_DIST && sx === null) {
          sx = dx + (t - ex);
          guides.push({ type: 'v', pos: t, y1: Math.min(dy, cy) - 20, y2: Math.max(dy + dh, cy + ch) + 20 });
        }
      }
    }
    for (const ey of edges_y) {
      for (const t of ty) {
        if (Math.abs(ey - t) < SNAP_DIST && sy === null) {
          sy = dy + (t - ey);
          guides.push({ type: 'h', pos: t, x1: Math.min(dx, cx) - 20, x2: Math.max(dx + dw, cx + cw) + 20 });
        }
      }
    }
  });
  return { x: sx, y: sy, guides };
}

function drawSnapGuides(guides) {
  if (!snapGuideEl) {
    snapGuideEl = document.createElement('div');
    snapGuideEl.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none;z-index:1';
    world.appendChild(snapGuideEl);
  }
  snapGuideEl.innerHTML = guides.map(g => {
    if (g.type === 'v') return `<div style="position:absolute;left:${g.pos}px;top:${g.y1}px;width:1px;height:${g.y2 - g.y1}px;border-left:1px dashed var(--accent);opacity:.6"></div>`;
    return `<div style="position:absolute;left:${g.x1}px;top:${g.pos}px;width:${g.x2 - g.x1}px;height:1px;border-top:1px dashed var(--accent);opacity:.6"></div>`;
  }).join('');
}

// ─── Auto-position new cards ───
function findOpenPosition() {
  const cards = document.querySelectorAll('.card');
  if (!cards.length) return { x: 20, y: 20 };
  let maxRight = 0, topY = 20;
  cards.forEach(c => {
    const x = parseFloat(c.style.left) || 0;
    const w = c.offsetWidth || 480;
    if (x + w > maxRight) { maxRight = x + w; topY = parseFloat(c.style.top) || 20; }
  });
  return { x: maxRight + CARD_GAP, y: topY };
}

// ─── JSON tree viewer ───
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function jsonTree(obj, key) {
  const label = key !== undefined ? `<span class="jk">"${esc(key)}"</span>: ` : '';

  if (obj === null) return `<div class="jleaf">${label}<span class="jnull">null</span></div>`;
  if (typeof obj === 'boolean') return `<div class="jleaf">${label}<span class="jb">${obj}</span></div>`;
  if (typeof obj === 'number') return `<div class="jleaf">${label}<span class="jn">${obj}</span></div>`;
  if (typeof obj === 'string') {
    const short = obj.length <= 80;
    const val = esc(short ? obj : obj.slice(0, 80) + '…');
    return `<div class="jleaf">${label}<span class="js">"${val}"</span></div>`;
  }

  if (Array.isArray(obj)) {
    if (obj.length === 0) return `<div class="jleaf">${label}<span class="jbrace">[]</span></div>`;
    const children = obj.map(v => jsonTree(v)).join('');
    return `<details open><summary>${label}<span class="jbrace">[</span><span class="jcount">${obj.length}</span></summary>${children}<div class="jleaf"><span class="jbrace">]</span></div></details>`;
  }

  const keys = Object.keys(obj);
  if (keys.length === 0) return `<div class="jleaf">${label}<span class="jbrace">{}</span></div>`;
  const children = keys.map(k => jsonTree(obj[k], k)).join('');
  return `<details open><summary>${label}<span class="jbrace">{</span><span class="jcount">${keys.length}</span></summary>${children}<div class="jleaf"><span class="jbrace">}</span></div></details>`;
}

function renderJSON(obj) {
  return `<div class="jt">${jsonTree(obj)}</div>`;
}

// ─── Card creation ───
let cardCount = 0;

function createCard(apiKey, posX, posY) {
  const api = APIS[apiKey];
  if (!api) return;
  const id = 'card-' + (++cardCount);
  const card = document.createElement('div');
  card.className = 'card';
  card.id = id;
  card.style.left = posX + 'px';
  card.style.top = posY + 'px';

  const methodClass = api.method.toLowerCase();

  const hasBody = api.body !== null;
  const defaultQuery = api.body?.query || '';

  // Presets as <option> for dropdown
  const presetOptions = api.presets ? api.presets.map((p, i) =>
    `<option value="${i}">${p.label}</option>`
  ).join('') : '';

  card.innerHTML = `
    <div class="card-header" onmousedown="startDrag(event, this.parentElement)">
      <span class="method-badge ${methodClass}">${api.method}</span>
      <span class="card-title">${api.path}</span>
      <button class="hdr-btn" onclick="this.closest('.card').remove()" title="Close">×</button>
    </div>
    <div class="card-body">
      ${hasBody ? `
      <div class="search-bar">
        <div class="search-row">
          <input class="query-input" id="${id}-query" value="${defaultQuery}" placeholder="Enter query..." oninput="syncToEditor('${id}')" onkeydown="if(event.key==='Enter')sendRequest('${id}','${apiKey}')"/>
          <button class="send-btn" id="${id}-send" onclick="sendRequest('${id}','${apiKey}')">Send</button>
          <span class="latency" id="${id}-latency"></span>
        </div>
        <div class="search-options">
          <input type="hidden" id="${id}-mode" value="lookup"/>
          <span class="opt-label">mode</span>
          <button class="mode-btn" onclick="setMode('${id}',this,'auto')">auto</button>
          <button class="mode-btn active" onclick="setMode('${id}',this,'lookup')">lookup</button>
          <button class="mode-btn" onclick="setMode('${id}',this,'list')">list</button>
          ${presetOptions ? `<span class="opt-label" style="margin-left:6px">preset</span>
          <select class="tb-select" style="font-size:9px;padding:2px 4px" onchange="applyPreset('${id}',this.value,'${apiKey}');this.selectedIndex=0"><option value="">--</option>${presetOptions}</select>` : ''}
        </div>
      </div>
      <div class="card-section">
        <div class="request-section collapsed" id="${id}-req-section">
          <div class="req-toggle" onclick="this.parentElement.classList.toggle('collapsed')">Request Body</div>
          <textarea class="json-editor" id="${id}-editor">${JSON.stringify(api.body, null, 2)}</textarea>
        </div>
      </div>` : `
      <div class="search-row" style="padding-bottom:6px">
        <button class="send-btn" id="${id}-send" onclick="sendRequest('${id}','${apiKey}')">Send</button>
        <span class="latency" id="${id}-latency"></span>
      </div>`}
      <div class="card-section">
        <div class="response-section">
          <div class="resp-header" onclick="this.parentElement.classList.toggle('collapsed')">
            <span class="section-label" style="cursor:pointer">Response</span>
            <button class="copy-btn" style="opacity:1;position:static;margin-left:auto" onclick="event.stopPropagation();copyResponse('${id}')">Copy</button>
          </div>
          <div class="response-wrap" id="${id}-resp-wrap">
            <div class="response-json" id="${id}-resp"><span class="response-placeholder">Send a request to see the response...</span></div>
          </div>
        </div>
      </div>
    </div>`;

  world.appendChild(card);

  // Prevent card interactions from triggering canvas pan
  card.addEventListener('mousedown', e => e.stopPropagation());

  // Validate JSON on input
  const editor = document.getElementById(id + '-editor');
  if (editor) {
    editor.addEventListener('input', () => {
      try { JSON.parse(editor.value); editor.classList.remove('invalid'); editor.classList.add('valid'); }
      catch { editor.classList.remove('valid'); editor.classList.add('invalid'); }
    });
  }

  return id;
}

function syncToEditor(cardId) {
  const editor = document.getElementById(cardId + '-editor');
  if (!editor) return;
  try {
    const body = JSON.parse(editor.value);
    const q = document.getElementById(cardId + '-query');
    const m = document.getElementById(cardId + '-mode');
    if (q) body.query = q.value;
    if (m) body.mode = m.value;
    editor.value = JSON.stringify(body, null, 2);
  } catch {}
}

function setMode(cardId, btn, mode) {
  document.getElementById(cardId + '-mode').value = mode;
  btn.parentElement.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  syncToEditor(cardId);
}

function applyPreset(cardId, presetIdx, apiKey) {
  const preset = APIS[apiKey].presets[presetIdx];
  if (!preset) return;
  const queryInput = document.getElementById(cardId + '-query');
  if (queryInput) queryInput.value = preset.query;
  syncToEditor(cardId);
}

function flattenLookupMatches(matches) {
  const flattened = [];
  for (const [pluginId, groups] of Object.entries(matches || {})) {
    for (const [aceType, items] of Object.entries(groups || {})) {
      for (const match of (items || [])) flattened.push({ pluginId, aceType, match });
    }
  }
  return flattened;
}

function renderSearchResults(data) {
  const lk = data.lookup;
  const lookupMatches = flattenLookupMatches(lk?.matches);
  const listCount = ['conditions', 'actions', 'expressions']
    .reduce((count, key) => count + (lk?.[key]?.length || 0), 0);
  const totalResults = lookupMatches.length + listCount;
  let html = `<div class="search-meta">
    <span>mode: <b>${data.mode}</b></span>
    <span>lang: <b>${data.lang}</b></span>
    <span>${data.ms}ms</span>
    <span>${totalResults} results</span>
  </div><div class="result-list">`;

  // Render lookup section
  if (lk) {
    const dbg = data.debug?.lookup;
    const confidence = dbg?.confidence;
    const confCls = confidence >= 0.85 ? 'high' : confidence >= 0.65 ? 'mid' : 'low';
    html += `<div class="result-card">
      <div class="result-header">
        <span class="result-type lookup">LOOKUP</span>
        ${dbg?.intent ? `<span class="result-subtitle">${esc(dbg.intent)}${dbg.plugin ? ' → ' + esc(dbg.plugin) : ''}</span>` : ''}
        ${confidence !== undefined ? `<span class="trace-conf ${confCls}" style="font-size:11px">${confidence.toFixed(2)}</span>` : ''}
      </div>
      ${dbg?.keywords?.length ? `<div class="result-meta">${dbg.keywords.map(k => `<span class="result-tag">${esc(k)}</span>`).join('')}</div>` : ''}`;

    // mode=list returns grouped name arrays.
    for (const key of ['conditions', 'actions', 'expressions']) {
      if (!lk[key]?.length) continue;
      html += `<div class="result-body" style="border-top:1px dashed var(--color-border-primary);padding:6px 8px">
        <span class="result-tag">${esc(key)}</span>
        <span class="result-subtitle" style="margin-left:4px">${lk[key].map(esc).join(', ')}</span>
      </div>`;
    }

    // mode=lookup/auto returns matches[plugin_id][ace_type].
    for (const { pluginId, aceType, match: m } of lookupMatches) {
      const names = m.name || {};
      const en = names.en || {};
      const localized = names[data.lang] || Object.entries(names).find(([lang]) => lang !== 'en')?.[1] || {};
      const title = localized.name || en.name || m.ace_id;
      html += `<div class="result-body" style="border-top:1px dashed var(--color-border-primary);padding:6px 8px">
        <span class="result-tag">${esc(aceType)}</span>
        <span class="result-title" style="margin-left:4px">${esc(title)}</span>
        ${en.name && en.name !== title ? `<span class="result-subtitle" style="margin-left:4px">${esc(en.name)}</span>` : ''}
        <span class="result-tag" style="margin-left:4px">${esc(pluginId)}</span>
        ${m.script_name ? `<br><span class="label">Script:</span> <span class="val">${esc(m.script_name)}</span>` : ''}
        ${localized.desc ? `<br><span class="label">描述:</span> ${esc(localized.desc)}` : ''}
        ${en.desc && en.desc !== localized.desc ? `<br><span class="label">Desc:</span> ${esc(en.desc)}` : ''}
        ${m.relevance ? `<br><span class="label">relevance:</span> <span class="val">${m.relevance}</span>` : ''}
      </div>`;
    }

    // Context (collapsible)
    if (lk.context) {
      html += `<div class="result-content" onclick="this.classList.toggle('expanded')">${esc(lk.context)}</div>`;
    }
    html += `</div>`;
  }

  html += `</div>`;
  return html;
}

async function sendRequest(cardId, apiKey) {
  const api = APIS[apiKey];
  const baseUrl = document.getElementById('baseUrl').value.replace(/\/+$/, '');
  const url = baseUrl + api.path;
  const respEl = document.getElementById(cardId + '-resp');
  const latencyEl = document.getElementById(cardId + '-latency');
  const sendBtn = document.getElementById(cardId + '-send');

  // Sync query input + mode dropdown → editor body
  const queryInput = document.getElementById(cardId + '-query');
  const modeSelect = document.getElementById(cardId + '-mode');
  const editor = document.getElementById(cardId + '-editor');
  if (editor) {
    try {
      const body = JSON.parse(editor.value);
      if (queryInput) body.query = queryInput.value;
      if (modeSelect) body.mode = modeSelect.value;
      editor.value = JSON.stringify(body, null, 2);
    } catch {}
  }

  sendBtn.disabled = true;
  sendBtn.textContent = '...';
  sendBtn.className = 'send-btn';
  latencyEl.textContent = '';
  respEl.innerHTML = '<span class="response-placeholder">Loading...</span>';

  const opts = { method: api.method, headers: {} };
  if (api.method === 'POST' && editor) {
    try {
      const parsed = JSON.parse(editor.value);
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(parsed);
    } catch {
      respEl.innerHTML = '<span class="response-placeholder" style="color:var(--color-danger)">Invalid JSON in request body</span>';
      sendBtn.disabled = false; sendBtn.textContent = 'Send'; sendBtn.className = 'send-btn';
      return;
    }
  }

  const t0 = performance.now();
  try {
    const res = await fetch(url, opts);
    const ms = Math.round(performance.now() - t0);
    let data;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('json')) {
      data = await res.json();
    } else {
      data = await res.text();
    }

    sendBtn.textContent = res.status;
    sendBtn.className = 'send-btn ' + (res.ok ? 'ok' : 'err');
    latencyEl.textContent = ms >= 1000 ? (ms/1000).toFixed(1) + 's' : ms + 'ms';

    if (typeof data === 'string') {
      respEl.textContent = data;
    } else {
      respEl.innerHTML = renderJSON(data);
      respEl.dataset.raw = JSON.stringify(data, null, 2);
    }
  } catch (err) {
    const ms = Math.round(performance.now() - t0);
    sendBtn.textContent = 'ERR';
    sendBtn.className = 'send-btn err';
    latencyEl.textContent = ms >= 1000 ? (ms/1000).toFixed(1) + 's' : ms + 'ms';
    respEl.innerHTML = `<span class="response-placeholder" style="color:var(--color-danger)">${err.message}</span>`;
  }

  sendBtn.disabled = false;
  // Reset button after 3s
  setTimeout(() => { if (!sendBtn.disabled) { sendBtn.textContent = 'Send'; sendBtn.className = 'send-btn'; } }, 3000);
}

function copyResponse(cardId) {
  const respEl = document.getElementById(cardId + '-resp');
  const raw = respEl.dataset.raw || respEl.textContent;
  navigator.clipboard.writeText(raw).then(() => {
    const btn = respEl.parentElement.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1200);
  });
}



function addCardFromSelect() {
  const key = document.getElementById('apiSelect').value;
  addCardFromKey(key);
}

// ─── Right-click context menu ───
const ctxMenu = document.getElementById('ctx-menu');
let ctxCard = null;

document.addEventListener('contextmenu', e => {
  if (e.target.closest('#toolbar')) return;
  e.preventDefault();
  ctxCard = e.target.closest('.card');
  ctxMenu.innerHTML = ctxCard ? `
    <div class="ctx-item" onclick="ctxAction('copy')">Copy Response</div>
    <div class="ctx-item" onclick="ctxAction('clear')">Clear Response</div>
    <div class="ctx-sep"></div>
    <div class="ctx-item danger" onclick="ctxAction('close')">Close Card</div>
  ` : `
    <div class="ctx-item" onclick="ctxAction('addSearch')">Add Search Card</div>
    ${!healthCardId || !document.getElementById(healthCardId) ? '<div class="ctx-item" onclick="ctxAction(\'addHealth\')">Add Health Card</div>' : ''}
    <div class="ctx-sep"></div>
    <div class="ctx-item" onclick="ctxAction('resetView')">Reset View</div>
  `;
  ctxMenu.style.left = e.clientX + 'px';
  ctxMenu.style.top = e.clientY + 'px';
  ctxMenu.classList.add('open');
  requestAnimationFrame(() => {
    const r = ctxMenu.getBoundingClientRect();
    if (r.right > innerWidth) ctxMenu.style.left = (e.clientX - r.width) + 'px';
    if (r.bottom > innerHeight) ctxMenu.style.top = (e.clientY - r.height) + 'px';
  });
});

document.addEventListener('click', e => { if (!ctxMenu.contains(e.target)) ctxMenu.classList.remove('open'); });

function ctxAction(action) {
  ctxMenu.classList.remove('open');
  if (action === 'copy' && ctxCard) {
    const resp = ctxCard.querySelector('.response-json');
    if (resp?.dataset.raw) navigator.clipboard.writeText(resp.dataset.raw);
  } else if (action === 'clear' && ctxCard) {
    const resp = ctxCard.querySelector('.response-json');
    if (resp) resp.innerHTML = '<span class="response-placeholder">Cleared</span>';
  } else if (action === 'close' && ctxCard) {
    ctxCard.remove();
  } else if (action === 'addSearch') {
    addCardFromKey('search');
  } else if (action === 'addHealth') {
    addCardFromKey('health');
  } else if (action === 'resetView') {
    resetView();
  }
}

let healthCardId = healthId;

function addCardFromKey(key) {
  if (key === 'health' && healthCardId && document.getElementById(healthCardId)) return;
  const pos = findOpenPosition();
  const id = createCard(key, pos.x, pos.y);
  if (key === 'health') healthCardId = id;
}
