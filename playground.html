<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Construct 3 RAG Playground</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#4d4e5190;border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:#6e6f7a}
*{scrollbar-width:thin;scrollbar-color:#4d4e5190 transparent}

:root{
  --bg:#1e1f22;--second:#37393c;--fg:#d0d0d9;--secondFg:#96969d;
  --selBg:#464b50;--selFg:#e0e0e9;--border:#3f3f3f;--dis:#666;
  --accent:#5378c8;--shadow:#212121;--deepBg:#1e1f22;
  --blue:#70b0ff;--red:#ff757f;--yellow:#ffbd76;
  --green:#7af8ca;--gray:#7e8eda;--purple:#baacff;--orange:#ff9668;
  --error:#dd3962;
}
body{font-family:'JetBrains Mono','Menlo','Consolas',monospace;background:var(--bg);color:var(--fg);overflow:hidden;height:100vh}

/* Toolbar */
#toolbar{position:fixed;top:0;left:0;right:0;z-index:200;height:44px;background:var(--second);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px}
.logo{color:var(--accent);font-weight:bold;font-size:13px;white-space:nowrap;letter-spacing:.3px}
.logo span{color:var(--green)}
.sep{width:1px;height:22px;background:var(--border)}
.tb-input{padding:5px 10px;background:var(--deepBg);border:1px solid var(--border);border-radius:4px;color:var(--fg);font:12px inherit;outline:none;width:240px}
.tb-input:focus{border-color:var(--accent)}
.tb-select{padding:5px 10px;background:var(--deepBg);border:1px solid var(--border);border-radius:4px;color:var(--fg);font:12px inherit;outline:none;cursor:pointer}
.tb-select:focus{border-color:var(--accent)}
.tb-btn{padding:5px 12px;background:transparent;color:var(--secondFg);border:1px solid var(--border);border-radius:4px;cursor:pointer;font:12px inherit;white-space:nowrap}
.tb-btn:hover{background:var(--selBg);color:var(--fg)}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.tb-btn.primary:hover{background:#6488d8}

/* Canvas */
#canvas{position:absolute;top:44px;left:0;right:0;bottom:0;overflow:hidden;cursor:grab;background-image:radial-gradient(circle,var(--second) 1px,transparent 1px);background-size:24px 24px}
#canvas.grabbing{cursor:grabbing}
#world{position:absolute;transform-origin:0 0}
#zoom-info{position:fixed;bottom:8px;right:12px;color:var(--dis);font-size:10px;z-index:100;user-select:none}

/* Card */
.card{position:absolute;width:540px;height:800px;min-width:320px;min-height:160px;background:var(--second);border:1px solid var(--border);border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;flex-direction:column;resize:both;overflow:hidden}
.card:hover{border-color:#505050}
.card-header{display:flex;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);cursor:move;gap:8px;background:var(--deepBg);border-radius:8px 8px 0 0;user-select:none}
.card-title{flex:1;font-size:12px;font-weight:bold;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.method-badge{font-size:10px;font-weight:bold;padding:2px 8px;border-radius:3px;letter-spacing:.5px}
.method-badge.get{background:#1a3a2a;color:var(--green)}
.method-badge.post{background:#1a2a3a;color:var(--blue)}
.hdr-btn{background:none;border:none;color:var(--dis);cursor:pointer;font-size:15px;padding:2px 4px;line-height:1}
.hdr-btn:hover{color:var(--fg)}
.card-body{padding:12px;flex:1;overflow:hidden;display:flex;flex-direction:column;gap:0;min-height:0}

/* Sections */
.section-label{font-size:10px;color:var(--secondFg);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px;flex-shrink:0}
.no-body{font-size:11px;color:var(--dis);font-style:italic;padding:8px 0;flex-shrink:0}

/* Request section: shrinks to content, doesn't grow beyond it */
.request-section{flex-shrink:0;display:flex;flex-direction:column;gap:4px;margin-bottom:0}
.json-editor{width:100%;padding:8px;background:var(--deepBg);color:var(--green);border:1px solid var(--border);border-radius:4px;font:11px/1.5 inherit;resize:none;outline:none;tab-size:2;min-height:80px;max-height:250px;overflow-y:auto;field-sizing:content}
.json-editor:focus{border-color:var(--accent)}
.json-editor.invalid{border-color:var(--red);color:var(--red)}

/* Presets */
.preset-btn{padding:2px 6px;background:var(--deepBg);border:1px solid var(--border);border-radius:3px;color:var(--secondFg);font:9px inherit;cursor:pointer;white-space:nowrap}
.preset-btn:hover{background:var(--selBg);color:var(--fg);border-color:var(--accent)}

/* Splitter between request and response */
.panel-splitter{height:6px;cursor:row-resize;display:flex;align-items:center;justify-content:center;flex-shrink:0;user-select:none}
.panel-splitter::after{content:'';width:32px;height:2px;background:var(--border);border-radius:1px}
.panel-splitter:hover::after{background:var(--accent)}

/* Search bar */
.search-bar{flex-shrink:0;display:flex;flex-direction:column;gap:4px;padding-bottom:6px;border-bottom:1px solid var(--border);margin-bottom:6px}
.search-row{display:flex;align-items:center;gap:6px}
.query-input{flex:1;padding:5px 8px;background:var(--deepBg);border:1px solid var(--border);border-radius:4px;color:var(--fg);font:12px inherit;outline:none}
.query-input:focus{border-color:var(--accent)}
.query-input::placeholder{color:var(--dis)}
.send-btn{padding:5px 14px;border:none;border-radius:4px;cursor:pointer;font:11px/1 inherit;font-weight:bold;color:#fff;background:var(--accent);transition:background .15s}
.send-btn:hover{background:#6488d8}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.send-btn.ok{background:#1a6a3a}
.send-btn.err{background:#6a1a2a}
.latency{font-size:10px;color:var(--dis)}
.search-options{display:flex;align-items:center;gap:6px}
.opt-label{font-size:9px;color:var(--dis)}
.mode-btn{padding:1px 6px;background:none;border:1px solid var(--border);border-radius:3px;color:var(--secondFg);font:9px inherit;cursor:pointer}
.mode-btn:hover{border-color:var(--accent);color:var(--fg)}
.mode-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Request body: collapsible */
.request-section.collapsed .json-editor{display:none}
.req-toggle{font-size:10px;color:var(--secondFg);cursor:pointer;user-select:none;padding:2px 0}
.req-toggle:hover{color:var(--accent)}
.request-section.collapsed .req-toggle::before{content:'▶ '}
.request-section:not(.collapsed) .req-toggle::before{content:'▼ '}

/* Response: takes ALL remaining space */
.response-section{flex:1;min-height:30px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.response-section.collapsed .response-wrap{display:none}
.response-section.collapsed .section-label::before{content:'▶ '}
.response-section:not(.collapsed) .section-label::before{content:'▼ '}
.resp-header{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.response-wrap{flex:1;min-height:0;overflow-y:auto;background:var(--deepBg);border:1px solid var(--border);border-radius:4px;position:relative}
.response-json{padding:8px;font:11px/1.5 inherit;white-space:pre-wrap;word-break:break-all;color:var(--fg)}
.response-placeholder{padding:8px;color:var(--dis);font-size:11px;font-style:italic}
.copy-btn{position:absolute;top:4px;right:4px;padding:2px 8px;background:var(--second);border:1px solid var(--border);border-radius:3px;color:var(--dis);font:10px inherit;cursor:pointer;opacity:0;transition:opacity .15s}
.response-wrap:hover .copy-btn{opacity:1}
.copy-btn:hover{color:var(--fg);border-color:var(--accent)}

/* Syntax highlighting */
.json-key{color:var(--blue)}
.json-str{color:var(--green)}
.json-num{color:var(--purple)}
.json-bool{color:var(--orange)}
.json-null{color:var(--dis)}
.json-brace{color:var(--secondFg)}

/* Result cards */
.result-list{display:flex;flex-direction:column;gap:6px;padding:8px}
.result-card{border:1px solid var(--border);border-radius:4px;overflow:hidden;font-size:11px}
.result-header{display:flex;align-items:center;gap:6px;padding:4px 8px;background:var(--deepBg)}
.result-type{font-size:9px;font-weight:bold;padding:1px 6px;border-radius:2px;text-transform:uppercase;letter-spacing:.3px}
.result-type.ace{background:#1a2a3a;color:var(--blue)}
.result-type.doc{background:#2a2a1a;color:var(--yellow)}
.result-type.example{background:#1a3a2a;color:var(--green)}
.result-type.term{background:#2a1a3a;color:var(--purple)}
.result-type.lookup{background:#3a2a1a;color:var(--orange)}
.result-score{font-size:9px;color:var(--dis);margin-left:auto}
.result-title{font-size:11px;font-weight:bold;color:var(--fg)}
.result-subtitle{font-size:10px;color:var(--secondFg)}
.result-body{padding:6px 8px;font-size:10px;line-height:1.5;color:var(--fg)}
.result-body .label{color:var(--secondFg)}
.result-body .val{color:var(--green)}
.result-body .val-zh{color:var(--yellow)}
.result-content{max-height:80px;overflow-y:auto;padding:4px 8px;font-size:10px;line-height:1.4;color:var(--secondFg);white-space:pre-wrap;word-break:break-all;border-top:1px dashed var(--border);cursor:pointer}
.result-content.expanded{max-height:none}
.result-meta{display:flex;flex-wrap:wrap;gap:4px;padding:4px 8px}
.result-tag{font-size:9px;padding:1px 5px;background:var(--selBg);border-radius:2px;color:var(--secondFg)}
.search-meta{display:flex;gap:12px;padding:4px 8px;font-size:10px;color:var(--secondFg);border-bottom:1px solid var(--border)}

/* Trace log */
.trace-panel{max-height:140px;overflow-y:auto;background:var(--deepBg);border:1px solid var(--border);border-radius:4px;font-size:10px;line-height:1.6;display:none}
.trace-panel.open{display:block}
.trace-step{padding:1px 8px;border-bottom:1px solid #2a2a2a;display:flex;gap:6px}
.trace-phase{color:var(--accent);min-width:50px;font-weight:bold}
.trace-phase.lookup{color:var(--yellow)}
.trace-phase.search{color:var(--green)}
.trace-phase.filter{color:var(--purple)}
.trace-phase.retrieve{color:var(--blue)}
.trace-phase.done{color:var(--green)}
.trace-phase.input{color:var(--dis)}
.trace-phase.expand{color:var(--orange)}
.trace-phase.decompose{color:#e0a0ff}
.trace-phase.route{color:#70d0ff}
.trace-phase.filter_drop{color:var(--red)}
.trace-msg{color:var(--fg)}
.trace-conf{display:inline-block;padding:0 4px;border-radius:2px;font-weight:bold}
.trace-conf.high{color:var(--green)}
.trace-conf.mid{color:var(--yellow)}
.trace-conf.low{color:var(--red)}
.trace-toggle{font-size:10px;color:var(--secondFg);cursor:pointer;user-select:none;padding:2px 0}
.trace-toggle:hover{color:var(--accent)}
</style>
</head>
<body>

<div id="toolbar">
  <div class="logo">Construct 3 <span>RAG</span> Playground</div>
  <input id="baseUrl" type="hidden" value="" />
  <div class="sep"></div>
  <select id="apiSelect" class="tb-select">
    <option value="health">GET /health</option>
    <option value="search">POST /search</option>
  </select>
  <button class="tb-btn primary" onclick="addCardFromSelect()">+ Add Card</button>
  <div style="flex:1"></div>
  <span id="env-status" style="font-size:10px;color:var(--dis)">checking...</span>
  <button class="tb-btn" onclick="resetView()">Reset View</button>
</div>

<div id="canvas" onmousedown="canvasDown(event)" onmousemove="canvasMove(event)" onmouseup="canvasUp(event)" onwheel="canvasWheel(event)">
  <div id="world"></div>
</div>
<div id="zoom-info">100%</div>

<script>
// ─── Canvas pan/zoom ───
const canvas = document.getElementById('canvas');
const world = document.getElementById('world');
const zoomInfo = document.getElementById('zoom-info');
let pan = { x: 40, y: 40 }, zoom = 1, panning = false, panStart = {};

function applyTransform() {
  world.style.transform = `translate(${pan.x}px,${pan.y}px) scale(${zoom})`;
  canvas.style.backgroundPosition = `${pan.x}px ${pan.y}px`;
  canvas.style.backgroundSize = `${24 * zoom}px ${24 * zoom}px`;
  zoomInfo.textContent = Math.round(zoom * 100) + '%';
}

function canvasDown(e) {
  if (e.target !== canvas) return;
  panning = true; panStart = { x: e.clientX - pan.x, y: e.clientY - pan.y };
  canvas.classList.add('grabbing');
}
function canvasMove(e) {
  if (!panning) return;
  pan.x = e.clientX - panStart.x; pan.y = e.clientY - panStart.y;
  applyTransform();
}
function canvasUp() { panning = false; canvas.classList.remove('grabbing'); }
function canvasWheel(e) {
  // Let scrollable card content handle its own scroll
  let el = e.target;
  while (el && el !== canvas) {
    if (el.scrollHeight > el.clientHeight + 2 || el.tagName === 'TEXTAREA') return;
    el = el.parentElement;
  }
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const wx = (mx - pan.x) / zoom, wy = (my - pan.y) / zoom;
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  zoom = Math.min(3, Math.max(0.2, zoom * delta));
  pan.x = mx - wx * zoom; pan.y = my - wy * zoom;
  applyTransform();
}
function resetView() { pan = { x: 40, y: 40 }; zoom = 1; applyTransform(); }

// ─── Panel splitter drag ───
let splitState = null;
function startSplit(e, splitter) {
  e.preventDefault(); e.stopPropagation();
  const reqSection = splitter.previousElementSibling;
  const editor = reqSection?.querySelector('.json-editor');
  if (!editor) return;
  splitState = { editor, startY: e.clientY, startH: editor.offsetHeight };
  document.addEventListener('mousemove', onSplitMove);
  document.addEventListener('mouseup', onSplitUp);
}
function onSplitMove(e) {
  if (!splitState) return;
  const dy = (e.clientY - splitState.startY) / zoom;
  const h = Math.max(40, splitState.startH + dy);
  splitState.editor.style.maxHeight = h + 'px';
  splitState.editor.style.minHeight = h + 'px';
}
function onSplitUp() {
  splitState = null;
  document.removeEventListener('mousemove', onSplitMove);
  document.removeEventListener('mouseup', onSplitUp);
}
applyTransform();

// ─── Card dragging ───
let dragCard = null, dragOff = {};
function startDrag(e, card) {
  if (e.button !== 0) return;
  dragCard = card;
  const x = parseFloat(card.style.left) || 0, y = parseFloat(card.style.top) || 0;
  dragOff = { x: e.clientX / zoom - x, y: e.clientY / zoom - y };
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
  e.preventDefault();
}
function onDrag(e) {
  if (!dragCard) return;
  dragCard.style.left = (e.clientX / zoom - dragOff.x) + 'px';
  dragCard.style.top = (e.clientY / zoom - dragOff.y) + 'px';
}
function endDrag() { dragCard = null; document.removeEventListener('mousemove', onDrag); document.removeEventListener('mouseup', endDrag); }

// ─── API definitions ───
const APIS = {
  health: {
    method: 'GET', path: '/health', body: null
  },
  search: {
    method: 'POST', path: '/search',
    body: {
      query: "Sprite 碰撞检测",
      mode: "auto",
      top_k: 5,
      lang: null,
      collections: null,
      plugin: null,
      section_types: null,
      apply_threshold: true,
      debug: true
    },
    presets: [
      { label: 'Sprite 碰撞', query: 'Sprite 碰撞检测' },
      { label: 'Platform 跳跃', query: 'Platform 跳跃行为' },
      { label: '计时器', query: '计时器 Timer 使用' },
      { label: 'Play animation', query: 'how to play animation' },
      { label: '翻译 Destroy', query: '翻译 Destroy' }
    ]
  }
};

// ─── JSON syntax highlighting ───
function highlightJSON(obj, indent) {
  indent = indent || 0;
  const pad = '  '.repeat(indent);
  if (obj === null) return `<span class="json-null">null</span>`;
  if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
  if (typeof obj === 'number') return `<span class="json-num">${obj}</span>`;
  if (typeof obj === 'string') {
    const escaped = obj.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return `<span class="json-str">"${escaped}"</span>`;
  }
  if (Array.isArray(obj)) {
    if (obj.length === 0) return `<span class="json-brace">[]</span>`;
    const items = obj.map(v => pad + '  ' + highlightJSON(v, indent + 1));
    return `<span class="json-brace">[</span>\n${items.join(',\n')}\n${pad}<span class="json-brace">]</span>`;
  }
  const keys = Object.keys(obj);
  if (keys.length === 0) return `<span class="json-brace">{}</span>`;
  const entries = keys.map(k => {
    const ek = k.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return pad + '  ' + `<span class="json-key">"${ek}"</span><span class="json-brace">:</span> ` + highlightJSON(obj[k], indent + 1);
  });
  return `<span class="json-brace">{</span>\n${entries.join(',\n')}\n${pad}<span class="json-brace">}</span>`;
}

// ─── Card creation ───
let cardCount = 0;

function createCard(apiKey, posX, posY) {
  const api = APIS[apiKey];
  if (!api) return;
  const id = 'card-' + (++cardCount);
  const card = document.createElement('div');
  card.className = 'card';
  card.id = id;
  card.style.left = posX + 'px';
  card.style.top = posY + 'px';

  const methodClass = api.method.toLowerCase();

  const hasBody = api.body !== null;
  const defaultQuery = api.body?.query || '';

  // Presets as <option> for dropdown
  const presetOptions = api.presets ? api.presets.map((p, i) =>
    `<option value="${i}">${p.label}</option>`
  ).join('') : '';

  card.innerHTML = `
    <div class="card-header" onmousedown="startDrag(event, this.parentElement)">
      <span class="method-badge ${methodClass}">${api.method}</span>
      <span class="card-title">${api.path}</span>
      <button class="hdr-btn" onclick="this.closest('.card').remove()" title="Close">×</button>
    </div>
    <div class="card-body">
      ${hasBody ? `
      <div class="search-bar">
        <div class="search-row">
          <input class="query-input" id="${id}-query" value="${defaultQuery}" placeholder="Enter query..." oninput="syncToEditor('${id}')" onkeydown="if(event.key==='Enter')sendRequest('${id}','${apiKey}')"/>
          <button class="send-btn" id="${id}-send" onclick="sendRequest('${id}','${apiKey}')">Send</button>
          <span class="latency" id="${id}-latency"></span>
        </div>
        <div class="search-options">
          <input type="hidden" id="${id}-mode" value="auto"/>
          <span class="opt-label">mode</span>
          <button class="mode-btn active" onclick="setMode('${id}',this,'auto')">auto</button>
          <button class="mode-btn" onclick="setMode('${id}',this,'lookup')">lookup</button>
          <button class="mode-btn" onclick="setMode('${id}',this,'semantic')">semantic</button>
          ${presetOptions ? `<span class="opt-label" style="margin-left:6px">preset</span>
          <select class="tb-select" style="font-size:9px;padding:2px 4px" onchange="applyPreset('${id}',this.value,'${apiKey}');this.selectedIndex=0"><option value="">--</option>${presetOptions}</select>` : ''}
        </div>
      </div>
      <div class="request-section collapsed" id="${id}-req-section">
        <div class="req-toggle" onclick="this.parentElement.classList.toggle('collapsed')">Request Body</div>
        <textarea class="json-editor" id="${id}-editor">${JSON.stringify(api.body, null, 2)}</textarea>
      </div>` : `
      <div class="search-row" style="padding-bottom:6px">
        <button class="send-btn" id="${id}-send" onclick="sendRequest('${id}','${apiKey}')">Send</button>
        <span class="latency" id="${id}-latency"></span>
      </div>`}
      <div class="response-section">
        <div class="resp-header" onclick="this.parentElement.classList.toggle('collapsed')">
          <span class="section-label" style="cursor:pointer">Response</span>
          <button class="copy-btn" style="opacity:1;position:static;margin-left:auto" onclick="event.stopPropagation();copyResponse('${id}')">Copy</button>
        </div>
        <div class="response-wrap" id="${id}-resp-wrap">
          <div class="response-json" id="${id}-resp"><span class="response-placeholder">Send a request to see the response...</span></div>
        </div>
      </div>
    </div>`;

  world.appendChild(card);

  // Validate JSON on input
  const editor = document.getElementById(id + '-editor');
  if (editor) {
    editor.addEventListener('input', () => {
      try { JSON.parse(editor.value); editor.classList.remove('invalid'); }
      catch { editor.classList.add('invalid'); }
    });
  }

  return id;
}

function syncToEditor(cardId) {
  const editor = document.getElementById(cardId + '-editor');
  if (!editor) return;
  try {
    const body = JSON.parse(editor.value);
    const q = document.getElementById(cardId + '-query');
    const m = document.getElementById(cardId + '-mode');
    if (q) body.query = q.value;
    if (m) body.mode = m.value;
    editor.value = JSON.stringify(body, null, 2);
  } catch {}
}

function setMode(cardId, btn, mode) {
  document.getElementById(cardId + '-mode').value = mode;
  btn.parentElement.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  syncToEditor(cardId);
}

function applyPreset(cardId, presetIdx, apiKey) {
  const preset = APIS[apiKey].presets[presetIdx];
  if (!preset) return;
  const queryInput = document.getElementById(cardId + '-query');
  if (queryInput) queryInput.value = preset.query;
  syncToEditor(cardId);
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderSemanticResult(r) {
  let html = `<div class="result-card">`;

  if (r.type === 'ace') {
    const p = r.plugin || {};
    html += `<div class="result-header">
      <span class="result-type ace">ACE</span>
      <span class="result-tag">${esc(r.ace_type)}</span>
      <span class="result-title">${esc(r.name_zh || r.name)}</span>
      <span class="result-subtitle">${esc(r.name)}</span>
      <span class="result-score">${r.score.toFixed(3)}</span>
    </div>
    <div class="result-body">
      <span class="label">Plugin:</span> <span class="val">${esc(p.name)}</span> <span class="val-zh">${esc(p.name_zh)}</span><br>
      ${r.description_zh ? `<span class="label">描述:</span> ${esc(r.description_zh)}<br>` : ''}
      ${r.description ? `<span class="label">Desc:</span> ${esc(r.description)}<br>` : ''}
      ${r.script_name ? `<span class="label">Script:</span> <span class="val">${esc(r.script_name)}</span><br>` : ''}
      ${r.params?.length ? `<span class="label">Params:</span> ${r.params.map(p => `<span class="val">${esc(p.name)}</span>(<span class="result-tag">${esc(p.type)}</span>)`).join(', ')}<br>` : ''}
      ${r.is_trigger ? '<span class="result-tag">trigger</span> ' : ''}${r.is_async ? '<span class="result-tag">async</span> ' : ''}${r.return_type ? `<span class="label">returns:</span> <span class="val">${esc(r.return_type)}</span>` : ''}
    </div>`;
  }

  else if (r.type === 'doc') {
    html += `<div class="result-header">
      <span class="result-type doc">DOC</span>
      <span class="result-title">${esc(r.title)}</span>
      ${r.section ? `<span class="result-subtitle">§ ${esc(r.section)}</span>` : ''}
      <span class="result-score">${r.score.toFixed(3)}</span>
    </div>
    <div class="result-meta"><span class="result-tag">${esc(r.collection)}</span><span class="result-tag">${esc(r.source)}</span></div>
    <div class="result-content" onclick="this.classList.toggle('expanded')">${esc(r.content?.substring(0, 300))}${r.content?.length > 300 ? '...' : ''}</div>`;
  }

  else if (r.type === 'example') {
    html += `<div class="result-header">
      <span class="result-type example">EXAMPLE</span>
      <span class="result-title">${esc(r.project)}</span>
      ${r.project_zh ? `<span class="result-subtitle">${esc(r.project_zh)}</span>` : ''}
      <span class="result-score">${r.score.toFixed(3)}</span>
    </div>
    <div class="result-content" onclick="this.classList.toggle('expanded')">${esc(r.content?.substring(0, 200))}</div>`;
  }

  else if (r.type === 'term') {
    html += `<div class="result-header">
      <span class="result-type term">TERM</span>
      <span class="result-title">${esc(r.zh)}</span>
      <span class="result-subtitle">${esc(r.en)}</span>
      <span class="result-score">${r.score.toFixed(3)}</span>
    </div>
    <div class="result-meta"><span class="result-tag">${esc(r.category)}</span></div>`;
  }

  else {
    html += `<div class="result-header">
      <span class="result-type">${esc(r.type || '?')}</span>
      <span class="result-score">${(r.score||0).toFixed(3)}</span>
    </div>
    <div class="result-content">${esc(JSON.stringify(r, null, 2))}</div>`;
  }

  html += `</div>`;
  return html;
}

function renderSearchResults(data) {
  const totalResults = (data.lookup?.hit ? data.lookup.matches.length : 0) + (data.semantic?.length || 0);
  let html = `<div class="search-meta">
    <span>mode: <b>${data.mode}</b></span>
    <span>lang: <b>${data.lang}</b></span>
    <span>${data.latency_ms}ms</span>
    <span>${totalResults} results</span>
  </div><div class="result-list">`;

  // Render lookup section
  if (data.lookup?.hit) {
    const lk = data.lookup;
    const confCls = lk.confidence >= 0.85 ? 'high' : lk.confidence >= 0.65 ? 'mid' : 'low';
    html += `<div class="result-card">
      <div class="result-header">
        <span class="result-type lookup">LOOKUP T${lk.tier}</span>
        <span class="result-subtitle">${esc(lk.intent)}${lk.plugin ? ' → ' + esc(lk.plugin.name_zh || lk.plugin.name || lk.plugin.id) : ''}</span>
        <span class="trace-conf ${confCls}" style="font-size:11px">${lk.confidence.toFixed(2)}</span>
      </div>
      ${lk.keywords?.length ? `<div class="result-meta">${lk.keywords.map(k => `<span class="result-tag">${esc(k)}</span>`).join('')}</div>` : ''}`;

    // Render each match as a mini ACE card
    for (const m of lk.matches) {
      html += `<div class="result-body" style="border-top:1px dashed var(--border);padding:6px 8px">
        <span class="result-tag">${esc(m.ace_type)}</span>
        <span class="result-title" style="margin-left:4px">${esc(m.name_zh || m.name_en)}</span>
        <span class="result-subtitle" style="margin-left:4px">${esc(m.name_en)}</span>
        <span class="result-tag" style="margin-left:4px">${esc(m.plugin_id)}</span>
        ${m.script_name ? `<br><span class="label">Script:</span> <span class="val">${esc(m.script_name)}</span>` : ''}
        ${m.description_zh ? `<br><span class="label">描述:</span> ${esc(m.description_zh)}` : ''}
        ${m.relevance ? `<br><span class="label">relevance:</span> <span class="val">${m.relevance}</span>` : ''}
      </div>`;
    }

    // Context (collapsible)
    if (lk.context) {
      html += `<div class="result-content" onclick="this.classList.toggle('expanded')">${esc(lk.context)}</div>`;
    }
    html += `</div>`;
  }

  // Render semantic results
  for (const r of (data.semantic || [])) {
    html += renderSemanticResult(r);
  }

  html += `</div>`;
  return html;
}

async function sendRequest(cardId, apiKey) {
  const api = APIS[apiKey];
  const baseUrl = document.getElementById('baseUrl').value.replace(/\/+$/, '');
  const url = baseUrl + api.path;
  const respEl = document.getElementById(cardId + '-resp');
  const latencyEl = document.getElementById(cardId + '-latency');
  const sendBtn = document.getElementById(cardId + '-send');

  // Sync query input + mode dropdown → editor body
  const queryInput = document.getElementById(cardId + '-query');
  const modeSelect = document.getElementById(cardId + '-mode');
  const editor = document.getElementById(cardId + '-editor');
  if (editor) {
    try {
      const body = JSON.parse(editor.value);
      if (queryInput) body.query = queryInput.value;
      if (modeSelect) body.mode = modeSelect.value;
      editor.value = JSON.stringify(body, null, 2);
    } catch {}
  }

  sendBtn.disabled = true;
  sendBtn.textContent = '...';
  sendBtn.className = 'send-btn';
  latencyEl.textContent = '';
  respEl.innerHTML = '<span class="response-placeholder">Loading...</span>';

  const opts = { method: api.method, headers: {} };
  if (api.method === 'POST' && editor) {
    try {
      const parsed = JSON.parse(editor.value);
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(parsed);
    } catch {
      respEl.innerHTML = '<span class="response-placeholder" style="color:var(--red)">Invalid JSON in request body</span>';
      sendBtn.disabled = false; sendBtn.textContent = 'Send'; sendBtn.className = 'send-btn';
      return;
    }
  }

  const t0 = performance.now();
  try {
    const res = await fetch(url, opts);
    const ms = Math.round(performance.now() - t0);
    let data;
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('json')) {
      data = await res.json();
    } else {
      data = await res.text();
    }

    sendBtn.textContent = res.status;
    sendBtn.className = 'send-btn ' + (res.ok ? 'ok' : 'err');
    latencyEl.textContent = ms >= 1000 ? (ms/1000).toFixed(1) + 's' : ms + 'ms';

    if (typeof data === 'string') {
      respEl.textContent = data;
    } else {
      respEl.innerHTML = highlightJSON(data);
      respEl.dataset.raw = JSON.stringify(data, null, 2);
    }
  } catch (err) {
    const ms = Math.round(performance.now() - t0);
    sendBtn.textContent = 'ERR';
    sendBtn.className = 'send-btn err';
    latencyEl.textContent = ms >= 1000 ? (ms/1000).toFixed(1) + 's' : ms + 'ms';
    respEl.innerHTML = `<span class="response-placeholder" style="color:var(--red)">${err.message}</span>`;
  }

  sendBtn.disabled = false;
  // Reset button after 3s
  setTimeout(() => { if (!sendBtn.disabled) { sendBtn.textContent = 'Send'; sendBtn.className = 'send-btn'; } }, 3000);
}

function copyResponse(cardId) {
  const respEl = document.getElementById(cardId + '-resp');
  const raw = respEl.dataset.raw || respEl.textContent;
  navigator.clipboard.writeText(raw).then(() => {
    const btn = respEl.parentElement.querySelector('.copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1200);
  });
}
