name: Update Construct 3 Data

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:  # manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      pr: ${{ steps.pr.outputs.pull-request-number }}
      sha: ${{ steps.pr.outputs.pull-request-head-sha }}
      needs_review: ${{ steps.diff.outputs.needs_review }}
      guides_changed: ${{ steps.guides.outputs.changed }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Scirra's guides are pages, not release data: fetched every week and
      # written only when their text changed. A failed fetch keeps the
      # committed copy and logs a warning; the release update goes on.
      - name: Refresh Scirra's guides
        id: guides
        run: |
          python scripts/init.py --guides-only
          if [ -n "$(git status --porcelain -- data/c3-guides)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A guide under data/c3-guides/ changed: compare it with docs/decisions/project-format-guide.md before merging." > "$RUNNER_TEMP/guides.md"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # data/c3-schemas/_index.json records the release data/ holds. A check
      # that cannot read the CDN writes no output, so no data step runs; the
      # guides' pull request still opens, and the last step fails the job.
      - name: Check for new version
        id: check
        continue-on-error: true
        run: python scripts/check_c3_version.py --github-output

      - name: Fetch new data
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "Updating from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}"
          # Same refresh a developer runs locally: export into the cache,
          # then replace data/c3-schemas, c3-examples, c3-lang and c3-ts-defs
          # (and fetch the guides again, which the step above wrote).
          # data/c3-example-usage stays as committed: the runner has no
          # Construct-Example-Projects clone to build it from.
          python scripts/init.py --version "${{ steps.check.outputs.latest }}"

      # What the release changed, against the data on main, as the PR body.
      # needs_review is true when a prompt, the skill, the code or a doc quotes
      # an id the release removed, deprecated or changed in a breaking way.
      - name: Report schema changes
        if: steps.check.outputs.changed == 'true'
        id: diff
        run: python scripts/schema_diff.py --base HEAD --output "$RUNNER_TEMP/schema-diff.md" --github-output

      - name: Compose the pull request body
        if: steps.check.outputs.changed == 'true' || steps.guides.outputs.changed == 'true'
        run: |
          for part in schema-diff.md guides.md; do
            if [ -f "$RUNNER_TEMP/$part" ]; then cat "$RUNNER_TEMP/$part"; echo; fi
          done > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true' || steps.guides.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.check.outputs.changed == 'true' && format('sync Construct 3 {0}', steps.check.outputs.latest) || 'sync Scirra''s guides' }}
          title: ${{ steps.check.outputs.changed == 'true' && format('sync Construct 3 {0}', steps.check.outputs.latest) || 'sync Scirra''s guides' }}
          body-path: ${{ runner.temp }}/pr-body.md
          branch: ${{ steps.check.outputs.changed == 'true' && format('c3-{0}', steps.check.outputs.latest) || 'c3-guides' }}
          delete-branch: true

      - name: Fail when the version check failed
        if: steps.check.outcome == 'failure'
        run: |
          echo "The version check could not read the CDN; see its step's log. data/ was not refreshed."
          exit 1

  # A pull request opened with GITHUB_TOKEN starts no other workflow, so the
  # checks of AGENTS.md run here, on the pull request's commit, through the
  # same workflow that checks every push and pull request.
  checks:
    needs: update
    if: always() && needs.update.outputs.pr != ''
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ needs.update.outputs.sha }}

  # The check report goes into the pull request's body: a failure's log and
  # every skipped test. A release that touches what the repository quotes
  # waits for a person, and so does a changed guide or a failed check. Other
  # checks on the pull request, if any, must all pass: a failure, a cancel,
  # or one still pending after 10 minutes stops the merge.
  report:
    needs: [update, checks]
    if: always() && needs.update.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.update.outputs.pr }}
    steps:
      - name: Add the check report to the pull request
        env:
          REPORT: ${{ needs.checks.outputs.report }}
          RESULT: ${{ needs.checks.result }}
        run: |
          {
            if [ "$RESULT" != success ] && [ -z "$REPORT" ]; then
              echo "The checks did not finish ($RESULT), so this pull request waits for a person."
              echo
            fi
            if [ -n "$REPORT" ]; then echo "$REPORT"; echo; fi
            gh pr view "$PR_NUMBER" --json body --jq .body
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr edit "$PR_NUMBER" --body-file "$RUNNER_TEMP/pr-body.md"

      - name: Enable auto-merge for PR
        if: needs.checks.result == 'success' && needs.update.outputs.needs_review != 'true' && needs.update.outputs.guides_changed != 'true'
        run: |
          for i in $(seq 1 60); do
            # gh exits non-zero while a check is pending, and when there is none
            OUT=$(gh pr checks "$PR_NUMBER" --json name,bucket 2>&1) || true
            if ! echo "$OUT" | jq -e 'type == "array"' > /dev/null 2>&1; then
              case "$OUT" in
                *"no checks reported"*) OUT='[]' ;;
                *) echo "Could not read the checks: $OUT"; exit 1 ;;
              esac
            fi
            FAILED=$(echo "$OUT" | jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")')
            PENDING=$(echo "$OUT" | jq '[.[] | select(.bucket == "pending")] | length')
            if [ -n "$FAILED" ]; then
              echo "Checks failed: $FAILED; not merging"
              exit 1
            fi
            if [ "$PENDING" = "0" ]; then
              echo "Checks on the pull request: $(echo "$OUT" | jq length), none failed or pending"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "$PENDING checks still pending after 10 minutes; not merging"
              exit 1
            fi
            echo "Waiting for $PENDING checks... ($i/60)"
            sleep 10
          done
          gh pr merge "$PR_NUMBER" --auto --squash
