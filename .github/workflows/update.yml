name: Update Construct 3 Data

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:  # manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The lookup-only requirements: src.settings imports the lookup package,
      # which needs jieba.
      - name: Install lookup-only deps
        run: pip install -r src/requirements.txt

      # Scirra's guides are pages, not release data: fetched every week and
      # written only when their text changed. A failed fetch keeps the
      # committed copy and logs a warning; the release update goes on.
      - name: Refresh Scirra's guides
        id: guides
        run: |
          python scripts/init.py --guides-only
          if [ -n "$(git status --porcelain -- data/c3-guides)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "A guide under data/c3-guides/ changed: compare it with docs/decisions/project-format-guide.md before merging." > "$RUNNER_TEMP/guides.md"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # data/c3-schemas/_index.json records the release data/ holds.
      - name: Check for new version
        id: check
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.settings import load_settings
          from src.ingest.c3_fetcher import latest_stable_version
          current = load_settings().schema.version
          latest = latest_stable_version()
          outputs = [f'current={current}', f'latest={latest}', f'changed={str(latest != current).lower()}']
          print(*outputs, sep=chr(10))
          with open('$GITHUB_OUTPUT', 'a') as f:
              print(*outputs, sep=chr(10), file=f)
          " || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Fetch new data
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "Updating from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}"
          # Same refresh a developer runs locally: export into the cache,
          # then replace data/c3-schemas, c3-examples, c3-lang and c3-ts-defs
          # (and fetch the guides again, which the step above wrote).
          python scripts/init.py --version "${{ steps.check.outputs.latest }}"

      # What the release changed, against the data on main, as the PR body.
      # needs_review is true when a prompt, the skill, the code or a doc quotes
      # an id the release removed, deprecated or changed in a breaking way.
      - name: Report schema changes
        if: steps.check.outputs.changed == 'true'
        id: diff
        run: python scripts/schema_diff.py --base HEAD --output "$RUNNER_TEMP/schema-diff.md" --github-output

      # A pull request opened with GITHUB_TOKEN starts no other workflow, so
      # the checks of AGENTS.md run here. A failure still opens the pull
      # request, says so in its body, and keeps it from auto-merge.
      - name: Run the repository's checks
        if: steps.check.outputs.changed == 'true' || steps.guides.outputs.changed == 'true'
        id: checks
        continue-on-error: true
        run: |
          pip install pytest httpx
          set -o pipefail
          {
            python -m pytest -q
            python -m compileall -q src scripts tests skills
            python scripts/build_plugin.py --check
          } 2>&1 | tee "$RUNNER_TEMP/checks.log"

      - name: Report failed checks
        if: steps.checks.outcome == 'failure'
        run: |
          {
            echo "The checks failed in the update job, so this pull request waits for a person:"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/checks.log"
            echo '```'
          } > "$RUNNER_TEMP/checks.md"

      - name: Compose the pull request body
        if: steps.check.outputs.changed == 'true' || steps.guides.outputs.changed == 'true'
        run: |
          for part in checks.md schema-diff.md guides.md; do
            if [ -f "$RUNNER_TEMP/$part" ]; then cat "$RUNNER_TEMP/$part"; echo; fi
          done > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true' || steps.guides.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ steps.check.outputs.changed == 'true' && format('sync Construct 3 {0}', steps.check.outputs.latest) || 'sync Scirra''s guides' }}
          title: ${{ steps.check.outputs.changed == 'true' && format('sync Construct 3 {0}', steps.check.outputs.latest) || 'sync Scirra''s guides' }}
          body-path: ${{ runner.temp }}/pr-body.md
          branch: ${{ steps.check.outputs.changed == 'true' && format('c3-{0}', steps.check.outputs.latest) || 'c3-guides' }}
          delete-branch: true

      # A release that touches what the repository quotes waits for a person,
      # and so does a changed guide or a failed check. Other checks on the pull
      # request, if any, must all pass: a failure, a cancel, or one still
      # pending after 10 minutes stops the merge.
      - name: Enable auto-merge for PR
        if: steps.pr.outputs.pull-request-number != '' && steps.checks.outcome == 'success' && steps.diff.outputs.needs_review != 'true' && steps.guides.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          for i in $(seq 1 60); do
            # gh exits non-zero while a check is pending, and when there is none
            OUT=$(gh pr checks "$PR_NUMBER" --json name,bucket 2>&1) || true
            if ! echo "$OUT" | jq -e 'type == "array"' > /dev/null 2>&1; then
              case "$OUT" in
                *"no checks reported"*) OUT='[]' ;;
                *) echo "Could not read the checks: $OUT"; exit 1 ;;
              esac
            fi
            FAILED=$(echo "$OUT" | jq -r '[.[] | select(.bucket == "fail" or .bucket == "cancel") | .name] | join(", ")')
            PENDING=$(echo "$OUT" | jq '[.[] | select(.bucket == "pending")] | length')
            if [ -n "$FAILED" ]; then
              echo "Checks failed: $FAILED; not merging"
              exit 1
            fi
            if [ "$PENDING" = "0" ]; then
              echo "Checks on the pull request: $(echo "$OUT" | jq length), none failed or pending"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "$PENDING checks still pending after 10 minutes; not merging"
              exit 1
            fi
            echo "Waiting for $PENDING checks... ($i/60)"
            sleep 10
          done
          gh pr merge "$PR_NUMBER" --auto --squash
