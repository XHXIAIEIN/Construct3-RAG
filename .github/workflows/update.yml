name: Update Construct 3 Data

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:  # manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The lookup-only requirements: src.settings imports the lookup package,
      # which needs jieba.
      - name: Install lookup-only deps
        run: pip install -r src/requirements.txt

      # data/c3-schemas/_index.json records the release data/ holds.
      - name: Check for new version
        id: check
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.settings import load_settings
          from src.ingest.c3_fetcher import latest_stable_version
          current = load_settings().schema.version
          latest = latest_stable_version()
          outputs = [f'current={current}', f'latest={latest}', f'changed={str(latest != current).lower()}']
          print(*outputs, sep=chr(10))
          with open('$GITHUB_OUTPUT', 'a') as f:
              print(*outputs, sep=chr(10), file=f)
          " || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Fetch new data
        if: steps.check.outputs.changed == 'true'
        run: |
          echo "Updating from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}"
          # Same refresh a developer runs locally: export into the cache,
          # then replace data/c3-schemas, c3-examples, c3-lang and c3-ts-defs.
          python scripts/init.py --version "${{ steps.check.outputs.latest }}"

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync Construct 3 ${{ steps.check.outputs.latest }}"
          title: "sync Construct 3 ${{ steps.check.outputs.latest }}"
          body: "${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          branch: c3-${{ steps.check.outputs.latest }}
          delete-branch: true

      - name: Enable auto-merge for PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # Wait for status checks to complete (max 10 minutes)
          for i in {1..60}; do
            STATUS=$(gh pr checks $PR_NUMBER --json state --jq '.[0].state // "pending"' 2>/dev/null || echo "pending")
            if [ "$STATUS" = "PASS" ]; then
              echo "✓ All checks passed"
              break
            elif [ "$STATUS" = "FAIL" ]; then
              echo "✗ Checks failed, skipping auto-merge"
              exit 1
            fi
            echo "Waiting for checks... ($i/60)"
            sleep 10
          done

          # Merge PR with squash strategy
          gh pr merge $PR_NUMBER --auto --squash || echo "Could not enable auto-merge (may already be merged)"
