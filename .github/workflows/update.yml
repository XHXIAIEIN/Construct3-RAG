name: Update Construct 3 Data

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:  # manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal deps
        run: pip install python-dotenv

      - name: Check for new version
        id: check
        run: |
          python -c "
          import sys, json, urllib.request
          sys.path.insert(0, '.')
          from src.config import C3_VERSION
          req = urllib.request.Request(
              'https://editor.construct.net/versions.json',
              headers={'User-Agent': 'Mozilla/5.0'}
          )
          versions = json.loads(urllib.request.urlopen(req, timeout=30).read())
          latest = next((v['releaseName'] for v in versions if v.get('branchName') == 'Stable'), C3_VERSION)
          print(f'current={C3_VERSION}')
          print(f'latest={latest}')
          changed = latest != C3_VERSION
          print(f'changed={str(changed).lower()}')
          # Set outputs
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'current={C3_VERSION}\n')
              f.write(f'latest={latest}\n')
              f.write(f'changed={str(changed).lower()}\n')
          " || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Fetch new data
        if: steps.check.outputs.changed == 'true'
        env:
          C3_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          echo "Updating from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}"

          # Update default version in config (all os.getenv C3_VERSION defaults)
          python - "$C3_VERSION" <<'PYEOF'
          import re, sys, pathlib
          ver = sys.argv[1]
          p = pathlib.Path("src/config.py")
          src = p.read_text()
          src = re.sub(
              r"""(os\.getenv\(["']C3_VERSION["'],\s*["'])r[\w.-]+(['"])""",
              lambda m: m.group(1) + ver + m.group(2),
              src,
          )
          p.write_text(src)
          PYEOF

          # Fetch CDN data and export
          python -c "
          import sys, json, shutil
          from pathlib import Path
          sys.path.insert(0, '.')
          from src.ingest.c3_fetcher import C3Fetcher

          version = '${{ steps.check.outputs.latest }}'
          f = C3Fetcher(version=version)

          # 1. Export schemas (per-language files + _index.json)
          print('Exporting schemas...')
          schemas_dir = f.export_schemas()

          target = Path('data/c3-schemas')
          if target.exists():
              shutil.rmtree(target)
          target.mkdir(parents=True, exist_ok=True)
          # Copy every exported locale directory plus the language-neutral index.
          # Hidden cache markers are deliberately excluded from version control.
          for src_path in schemas_dir.iterdir():
              if src_path.name.startswith('.'):
                  continue
              item = src_path.name
              dst_path = target / item
              if src_path.is_dir():
                  shutil.copytree(src_path, dst_path)
              elif src_path.is_file():
                  shutil.copy2(src_path, dst_path)
          idx = json.loads((target / '_index.json').read_text(encoding='utf-8'))
          print(f'Schemas: {len(idx.get(\"plugins\", {}))} plugins, {len(idx.get(\"behaviors\", {}))} behaviors, {len(idx.get(\"effects\", {}))} effects')

          # Copy examples (separate from schemas)
          examples_src = schemas_dir.parent / 'examples'
          examples_target = Path('data/c3-examples')
          if examples_target.exists():
              shutil.rmtree(examples_target)
          if examples_src.exists():
              shutil.copytree(examples_src, examples_target)
              en_count = len(list((examples_target / 'en-US').glob('*.json'))) if (examples_target / 'en-US').exists() else 0
              print(f'Examples: {en_count}')

          # 2. Export ts-defs
          print('Exporting ts-defs...')
          ts_dir = f.export_ts_defs()

          ts_target = Path('data/c3-ts-defs')
          if ts_target.exists():
              shutil.rmtree(ts_target)
          ts_target.mkdir(parents=True, exist_ok=True)
          for src_file in ts_dir.rglob('*.d.ts'):
              rel = src_file.relative_to(ts_dir)
              dst = ts_target / rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src_file, dst)
          ac = ts_dir / 'autocomplete-data.json'
          if ac.exists():
              shutil.copy2(ac, ts_target / 'autocomplete-data.json')
          print(f'TS defs: {len(list(ts_target.rglob(\"*.d.ts\")))} files')
          "

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync Construct 3 ${{ steps.check.outputs.latest }}"
          title: "sync Construct 3 ${{ steps.check.outputs.latest }}"
          body: "${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          branch: c3-${{ steps.check.outputs.latest }}
          delete-branch: true

      - name: Enable auto-merge for PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # Wait for status checks to complete (max 10 minutes)
          for i in {1..60}; do
            STATUS=$(gh pr checks $PR_NUMBER --json state --jq '.[0].state // "pending"' 2>/dev/null || echo "pending")
            if [ "$STATUS" = "PASS" ]; then
              echo "✓ All checks passed"
              break
            elif [ "$STATUS" = "FAIL" ]; then
              echo "✗ Checks failed, skipping auto-merge"
              exit 1
            fi
            echo "Waiting for checks... ($i/60)"
            sleep 10
          done

          # Merge PR with squash strategy
          gh pr merge $PR_NUMBER --auto --squash || echo "Could not enable auto-merge (may already be merged)"
