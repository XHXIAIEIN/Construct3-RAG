name: Update Construct 3 Data

# Runs every Wednesday 10:00 UTC (after Scirra's typical Tuesday evening UK release)
on:
  schedule:
    - cron: '0 10 * * 3'
  workflow_dispatch:  # manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The lookup-only requirements: src.settings imports the lookup package,
      # which needs jieba, and python-dotenv alone is not enough.
      - name: Install lookup-only deps
        run: pip install -r src/requirements.txt

      - name: Check for new version
        id: check
        run: |
          python -c "
          import sys, json, urllib.request
          sys.path.insert(0, '.')
          from src.settings import load_settings
          C3_VERSION = load_settings().schema.version
          req = urllib.request.Request(
              'https://editor.construct.net/versions.json',
              headers={'User-Agent': 'Mozilla/5.0'}
          )
          versions = json.loads(urllib.request.urlopen(req, timeout=30).read())
          latest = next((v['releaseName'] for v in versions if v.get('branchName') == 'Stable'), C3_VERSION)
          print(f'current={C3_VERSION}')
          print(f'latest={latest}')
          changed = latest != C3_VERSION
          print(f'changed={str(changed).lower()}')
          # Set outputs
          with open('$GITHUB_OUTPUT', 'a') as f:
              f.write(f'current={C3_VERSION}\n')
              f.write(f'latest={latest}\n')
              f.write(f'changed={str(changed).lower()}\n')
          " || echo "changed=false" >> $GITHUB_OUTPUT

      - name: Fetch new data
        if: steps.check.outputs.changed == 'true'
        env:
          C3_VERSION: ${{ steps.check.outputs.latest }}
        run: |
          echo "Updating from ${{ steps.check.outputs.current }} to ${{ steps.check.outputs.latest }}"

          # Update the default version. src/settings/__init__.py owns the
          # C3_VERSION default. Fail loudly if the pattern is not found so
          # the sync PR cannot ship a stale default.
          python - "$C3_VERSION" <<'PYEOF'
          import re, sys, pathlib
          ver = sys.argv[1]
          p = pathlib.Path("src/settings/__init__.py")
          src = p.read_text()
          pattern = r"""(_string\(source,\s*["']C3_VERSION["'],\s*["'])r[\w.-]+(['"])"""
          src, n = re.subn(pattern, lambda m: m.group(1) + ver + m.group(2), src)
          if n != 1:
              sys.exit(f"expected one C3_VERSION default in {p}, found {n}")
          p.write_text(src)
          PYEOF

          # Same refresh a developer runs locally: export into the cache,
          # then replace data/c3-schemas, c3-examples, c3-lang and c3-ts-defs.
          python scripts/init.py --version "$C3_VERSION"

      - name: Create Pull Request
        if: steps.check.outputs.changed == 'true'
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "sync Construct 3 ${{ steps.check.outputs.latest }}"
          title: "sync Construct 3 ${{ steps.check.outputs.latest }}"
          body: "${{ steps.check.outputs.current }} → ${{ steps.check.outputs.latest }}"
          branch: c3-${{ steps.check.outputs.latest }}
          delete-branch: true

      - name: Enable auto-merge for PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.pull-request-number }}
        run: |
          # Wait for status checks to complete (max 10 minutes)
          for i in {1..60}; do
            STATUS=$(gh pr checks $PR_NUMBER --json state --jq '.[0].state // "pending"' 2>/dev/null || echo "pending")
            if [ "$STATUS" = "PASS" ]; then
              echo "✓ All checks passed"
              break
            elif [ "$STATUS" = "FAIL" ]; then
              echo "✗ Checks failed, skipping auto-merge"
              exit 1
            fi
            echo "Waiting for checks... ($i/60)"
            sleep 10
          done

          # Merge PR with squash strategy
          gh pr merge $PR_NUMBER --auto --squash || echo "Could not enable auto-merge (may already be merged)"
